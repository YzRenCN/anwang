<video id="video" controls width="100%" height="500px" playsinline webkit-playsinline></video>
<script>
  var video = document.getElementById('video');
  var videoSrc = 'https://lsbbf5.com/20250805/w9tJeGhV/1000kb/hls/index.m3u8'; // 换成你的 m3u8 地址

  if (Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(videoSrc);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari 浏览器原生支持 HLS
    video.src = videoSrc;
  } else {
    alert('你的浏览器不支持播放该视频格式');
  }
</script>
